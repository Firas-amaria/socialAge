<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Manager Application</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="card-header">
        <p class="eyebrow">Social Manager Demo</p>
        <h1 id="page-title">Application Form</h1>
        <p class="subtitle">Submit your details to start the Social Manager review process.</p>
      </header>

      <form id="applicationForm" class="form" novalidate>
        <div class="field">
          <label for="fullLegalName">Full Legal Name</label>
          <input id="fullLegalName" name="fullLegalName" type="text" autocomplete="name" required>
          <p class="error" id="fullLegalNameError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="governmentIdNumber">Government ID Number</label>
          <input id="governmentIdNumber" name="governmentIdNumber" type="text" autocomplete="off" required>
          <p class="error" id="governmentIdNumberError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="referenceText">Reference Notes</label>
          <textarea id="referenceText" name="referenceText" rows="4" required></textarea>
          <p class="error" id="referenceTextError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="idImage">Government ID Image</label>
          <input id="idImage" name="idImage" type="file" accept="image/*" required>
          <p class="help">Upload a clear, readable photo of your ID.</p>
          <p class="error" id="idImageError" aria-live="polite"></p>
        </div>

        <div class="preview" id="imagePreviewWrapper" hidden>
          <p class="preview-title">Image Preview</p>
          <img id="imagePreview" alt="Selected ID preview">
        </div>

        <button type="submit" class="primary-btn">Submit Application</button>
        <p id="formSuccess" class="status" role="status" aria-live="polite"></p>
      </form>

      <a class="back-link" href="/">Back to Home</a>
    </section>
  </main>

  <script src="../js/manager-application.js"></script>
</body>

</html>
