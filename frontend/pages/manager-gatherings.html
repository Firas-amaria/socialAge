<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Gatherings</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="manager">
  <header data-manager-header></header>
  <div class="manager-shell">
    <aside class="manager-sidebar" data-manager-sidebar></aside>
    <main class="manager-content">
      <section class="card manager-page card--wide" aria-labelledby="page-title">
        <header class="card-header">
          <h1 id="page-title">My Gatherings</h1>
        </header>

        <p id="gatheringsStatus" class="status" role="status" aria-live="polite">Loading gatherings...</p>
        <section class="manager-gathering-section" aria-labelledby="current-title">
          <div class="manager-gathering-section__head">
            <h2 id="current-title">Current Gatherings</h2>
          </div>
          <div id="managerCurrentGatheringsList" class="manager-gatherings-list" aria-live="polite"></div>
        </section>

        <section class="manager-gathering-section" aria-labelledby="upcoming-title">
          <div class="manager-gathering-section__head">
            <h2 id="upcoming-title">Upcoming Gatherings</h2>
          </div>
          <div id="managerUpcomingGatheringsList" class="manager-gatherings-list" aria-live="polite"></div>
        </section>

        <div class="button-grid">
          <a class="secondary-btn button-link" href="/manager-past-gatherings">View Past Gatherings</a>
          <a class="primary-btn button-link" href="/manager-create-gathering">Create New Gathering</a>
        </div>
      </section>
    </main>
  </div>
  <script src="/js/env.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/manager-common.js"></script>
  <script src="../js/manager-header.js"></script>
  <script src="../js/manager-sidebar.js"></script>
  <script src="../js/manager-gatherings.js"></script>
</body>

</html>
