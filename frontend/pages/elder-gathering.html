
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elder Gathering Details</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="elder">

<header data-elder-header></header>


<div class="container">
  <div id="eventCard" class="card event-detail-card">

    <div id="eventTop" class="event-top">
      <div class="event-top__head">
        <div id="eventIcon" class="event-top__icon" aria-hidden="true">?</div>
        <h2 id="eventTitle" class="event-top__title"></h2>
      </div>
    </div>

    <div class="event-details-list">
      <div class="event-details-row event-details-row--split">
        <p class="event-details-cell"><strong>Date:</strong> <span id="eventDate"></span></p>
        <p class="event-details-cell"><strong>Time:</strong> <span id="eventTime"></span></p>
      </div>
      <p class="event-details-row"><strong>Location:</strong> <span id="eventLocation"></span></p>
      <div class="event-description-box">
        <span class="event-description-box__label">Description</span>
        <p id="eventDescription" class="event-description-box__content"></p>
      </div>
    </div>

    <button id="registerBtn" class="btn btn-primary">Register</button>

  </div>
</div>

<script src="../js/elder-header.js"></script>
<script src="/js/env.js"></script>
<script src="../js/api.js"></script>
<script src="../js/gathering-card.js"></script>
<script src="../js/elder-main.js"></script>
</body>
</html>
