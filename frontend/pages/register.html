
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="elder auth-page">

<header data-elder-header></header>

<main class="auth-wrap">
  <section class="card auth-card">
    <h2>Create Account</h2>

    <form id="registerForm" class="auth-form">
      <label for="name">Full Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="password">Password:</label>
      <div class="password-field">
        <input type="password" id="password" required>
        <button type="button" class="icon-btn" data-toggle-password data-target="password" aria-label="Show password">
          <span aria-hidden="true">👁</span>
        </button>
      </div>

      <label for="confirmPassword">Confirm Password:</label>
      <div class="password-field">
        <input type="password" id="confirmPassword" required>
        <button type="button" class="icon-btn" data-toggle-password data-target="confirmPassword" aria-label="Show password">
          <span aria-hidden="true">👁</span>
        </button>
      </div>

      <button class="btn btn-primary" type="submit">Register</button>
      <p class="help">Already have an account? <a href="/login">Login</a></p>
    </form>
  </section>
</main>

<script src="/js/env.js"></script>
<script src="../js/elder-header.js"></script>
<script src="../js/auth.ts"></script>
</body>
</html>
